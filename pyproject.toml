[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spmkit-validation"
version = "0.1.0"
description = "External process-isolated validation harness and evidence archive for SPM-Kit"
authors = [
    { name = "José Labarca Baeza", email = "jlabarca@usm.cl" },
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml",
    "pytest>=7.0",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/kegouro/spmkit-validation"
Repository = "https://github.com/kegouro/spmkit-validation"
Issues = "https://github.com/kegouro/spmkit-validation/issues"
"SPM-Kit" = "https://github.com/kegouro/spmkit"

[project.scripts]
spmkit-validation = "spmkit_validation.cli:main"
spmkit-validation-classify = "spmkit_validation.dataset_classifier:main"
