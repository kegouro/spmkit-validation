protocol_id: roughness-threshold-calibration-v0.1
mode: CALIBRATION
state: CANDIDATE_FROZEN
evidence_target: LEVEL 2 NUMERICALLY_VERIFIED
candidate_policy:
  absolute_tolerance_nm: 1.0e-6
  relative_tolerance: 1.0e-6
  criterion: abs(a-b) <= absolute_tolerance_nm + relative_tolerance * max(abs(a), abs(b))
  metrics: [Sa, Sq, Sz]
  normalized_unit: nm
  nonfinite_values: out_of_scope
  relaxation_after_observation: forbidden
matrix_contract:
  shape: [256, 256]
  numeric_unit: nm
  dtype: float32
  byte_order: little
  memory_order: C
  gsf_z_unit: nm
  gsf_payload_scaling: none
  shared_matrix_bytes: required
comparison_controls:
  leveling: forbidden
  filtering: forbidden
  interpolation: forbidden
  resampling: forbidden
  line_correction: forbidden
corpus:
  independent_of_pilot_p01_p04: true
  excluded_from_future_48_exact_cases: true
  cases:
    - {case_id: C01_ZERO, family: constant, value_nm: 0.0}
    - {case_id: C02_CONSTANT_1000, family: constant, value_nm: 1000.0}
    - {case_id: C03_SINGLE_IMPULSE, family: single_impulse, value_nm: 100.0, row: 128, column: 128}
    - {case_id: C04_CHECKERBOARD, family: checkerboard, negative_nm: -50.0, positive_nm: 50.0}
    - {case_id: C05_RAMP_X, family: ramp_x, start_nm: 17.0, span_nm: 230.0}
    - {case_id: C06_RAMP_Y, family: ramp_y, start_nm: 83.0, span_nm: -170.0}
    - {case_id: C07_SINE_X_SMALL, family: sine_x, amplitude_nm: 0.001, periods: 3, phase_rad: 0.37}
    - {case_id: C08_SINE_X_37, family: sine_x, amplitude_nm: 37.0, periods: 7, phase_rad: 0.0}
    - {case_id: C09_SINE_Y_750, family: sine_y, amplitude_nm: 750.0, periods: 5, phase_rad: 0.0}
    - {case_id: C10_SINE_XY_83, family: sine_xy, amplitude_nm: 83.0, periods_x: 4, periods_y: 3}
    - {case_id: C11_STEP_37, family: step_x, split_ratio: 0.37, height_nm: 100.0}
    - {case_id: C12_STEP_63_SMALL, family: step_x, split_ratio: 0.63, height_nm: 0.01}
