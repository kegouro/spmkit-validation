protocol_id: gwyddion-pilot-v0.1
mode: PILOT
evidence_target: LEVEL 2 NUMERICALLY_VERIFIED
pass_fail_thresholds: null
matrix_shape: [256, 256]
physical_extent:
  x_size_m: 1.0e-5
  y_size_m: 1.0e-5
  xy_unit: m
z_unit: nm
stochastic_seed: 42
metrics_primary: [Sa, Sq, Sz]
comparison_controls:
  leveling: forbidden
  filtering: forbidden
  line_correction: forbidden
  interpolation: forbidden
  resampling: forbidden
  definitive_pass_fail: forbidden
matrix_contract:
  generator_dtype: float64
  canonical_dtype: float32_little_endian
  canonical_order: row_major_y_then_x
  canonical_matrix_sha256: required_per_case
  spmkit_input: canonical_npz_float32
  gwyddion_input: canonical_gsf_float32
  exchange_format_sha256: required_per_case
  invariant: identical_canonical_matrix_bytes_for_both_tools
  orientation: row_0_is_y_min_and_column_0_is_x_min
  sz_definition: maximum_height_minus_minimum_height
comparison_record:
  absolute_difference: required
  relative_difference: required
  units: nm
cases:
  - case_id: P01_PLANE_RAW
    generator: inclined_plane
    parameters:
      slope_x: 0.002
      slope_y: 0.001
      z_offset_m: 0.0
    corruptions: []
  - case_id: P02_SINE_RAW
    generator: sinusoidal_surface
    parameters:
      axis: x
      amplitude_m: 5.0e-8
      period_x_m: 2.5e-6
      period_y_m: 1.0e-5
      phase_rad: 0.0
    corruptions: []
  - case_id: P03_STEP_GAUSSIAN
    generator: step_surface
    parameters:
      step_height_m: 1.0e-7
      x_split_ratio: 0.5
    corruptions:
      - type: AdditiveGaussianNoise
        sigma_m: 5.0e-9
        seed: 42
  - case_id: P04_SINE_LINE_OFFSETS
    generator: sinusoidal_surface
    parameters:
      axis: x
      amplitude_m: 5.0e-8
      period_x_m: 2.5e-6
      period_y_m: 1.0e-5
      phase_rad: 0.0
    corruptions:
      - type: LineOffsets
        sigma_m: 5.0e-9
        seed: 42
