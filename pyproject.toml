[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spmkit-validation"
version = "0.1.4"
description = "External process-isolated validation harness and evidence archive for SPM-Kit"
authors = [
    { name = "José Labarca Baeza", email = "jlabarca@usm.cl" },
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "gwyfile==0.3.0",
    "jsonschema>=4.18,<5",
    "numpy>=1.24,<3",
    "pyyaml",
    "pytest>=7.0",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/kegouro/spmkit-validation"
Repository = "https://github.com/kegouro/spmkit-validation"
Issues = "https://github.com/kegouro/spmkit-validation/issues"
"SPM-Kit" = "https://github.com/kegouro/spmkit"

[project.optional-dependencies]
campaign = ["spmkit-phantoms @ git+https://github.com/kegouro/spmkit-phantoms@09aaee4870772c14be70cbd0e1f31435e177578b"]

[project.scripts]
spmkit-validation = "spmkit_validation.cli:main"
spmkit-validation-classify = "spmkit_validation.dataset_classifier:main"

[dependency-groups]
dev = [
    "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spmkit_validation"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/v0.1" = "spmkit_validation/_schema_resources/v0.1"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/schemas",
    "/tests",
    "/examples",
    "/docs",
    "/README.md",
    "/SCHEMA_CHANGELOG.md",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"
extend-exclude = ["campaigns/*/artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.hatch.metadata]
allow-direct-references = true
