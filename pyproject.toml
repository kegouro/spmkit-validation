[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spmkit-validation"
version = "0.1.3"
description = "Arnés externo de validación para SPM-Kit"
authors = [
    { name = "SPM-Kit contributors" },
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gwyfile==0.3.0",
    "jsonschema>=4.18,<5",
    "numpy>=1.24,<3",
    "pyyaml",
    "pytest>=7.0",
    "matplotlib>=3.7",
]

[project.scripts]
spmkit-validation = "spmkit_validation.cli:main"
spmkit-validation-classify = "spmkit_validation.dataset_classifier:main"

[dependency-groups]
dev = [
    "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spmkit_validation"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/v0.1" = "spmkit_validation/_schema_resources/v0.1"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/schemas",
    "/tests",
    "/examples",
    "/docs",
    "/README.md",
    "/SCHEMA_CHANGELOG.md",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"
extend-exclude = ["campaigns/*/artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
